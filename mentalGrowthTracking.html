    <!-- Time Series Graph -->
    <canvas id="myChart"></canvas>
    <style>
      #myChart {
        width: 1200px;
        height: 600px;
        margin: auto;
        display: block;
      }
    </style>
    <script>
      var ctx = document.getElementById('myChart').getContext('2d');
      var myChart = new Chart(ctx, {
        type: 'line', // Changed to 'line' for time series graph
        data: {
          labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5'], // Time intervals
          datasets: [
            {
              label: 'Depression',
              borderColor: '#7f7e9b', // Line color for Depression
              backgroundColor: 'rgba(127, 126, 155, 0.2)', // Transparent background
              data: [5, 4, 3, 3, 2], // Depression data points
              fill: true, // Fill under the line
              tension: 0.4 // Smooth curve
            },
            {
              label: 'Anxiety',
              borderColor: '#f2d699', // Line color for Anxiety
              backgroundColor: 'rgba(242, 214, 153, 0.2)', // Transparent background
              data: [4, 3, 3, 2, 1], // Anxiety data points
              fill: true,
              tension: 0.4
            },
            {
              label: 'Stress',
              borderColor: '#567a9d', // Line color for Stress
              backgroundColor: 'rgba(86, 122, 157, 0.2)', // Transparent background
              data: [5, 5, 4, 3, 2], // Stress data points
              fill: true,
              tension: 0.4
            }
          ]
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1,
                callback: function (value) {
                  const labels = ['minimal', 'mild', 'moderate', 'severe', 'extremely severe'];
                  return labels[value - 1] || '';
                }
              },
              max: 5
            },
            x: {
              title: {
                display: true,
                text: 'Time (Weeks)'
              }
            }
          },
          plugins: {
            legend: {
              display: true,
              position: 'bottom'
            },
            title: {
              display: true,
              text: 'Mental Growth Tracking Over Time',
              font: {
                size: 20
              },
              padding: {
                top: 10,
                bottom: 30
              }
            }
          }
        }
      });
    </script>
